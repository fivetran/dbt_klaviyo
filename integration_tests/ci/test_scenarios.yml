#   bigquery: ">=1.3.0,<2.0.0"
#   postgres: ">=1.3.0,<2.0.0"
#   redshift: ">=1.3.0,<2.0.0"
#   databricks: ">=1.6.0,<2.0.0"

schema_variable_name: "klaviyo_schema"

include_databricks_sql: false
include_sqlserver: false
include_dbt_compile: true

test_scenarios:
  - name: "Default"
    vars: {}
    include_incremental: false

  - name: "native attribution disabled"
    vars:
      using_native_attribution: false
    include_incremental: false

  - name: "event identifier norename"
    vars:
      klaviyo_event_identifier: "event_norename"
    include_incremental: false