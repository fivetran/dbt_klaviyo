version: 1.6.0
pr_number: 70
new_features:
- description: Raises the minimum dbt version to 1.10.0.
- description: Adds `dbt_utils.unique_combination_of_columns` tests to staging and end models. If a test fails, please [open an issue](https://github.com/fivetran/dbt_klaviyo/issues/new/choose).
under_the_hood:
- description: Corrects the documented column names for `int_klaviyo__event_attribution` and `klaviyo__persons` so the documentation matches the columns these models actually output.
  details:
  - Renames the documented `last_touch_type` column to `session_touch_type` in `int_klaviyo__event_attribution`.
  - Removes the documented `touch_session` column from `int_klaviyo__event_attribution`. This column is internal to the model's CTE logic and is not part of the model output.
  - Renames the documented `last_event_date_at` column to `last_event_date` in `klaviyo__persons`.
